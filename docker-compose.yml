version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    ports:
      - "3002:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/lula
    env_file:
      - ./apps/backend/.env
    depends_on:
      - mongo
    volumes:
      - ./apps/backend/uploads:/app/uploads
      - ./apps/backend/logs:/app/logs
    networks:
      - lula-network

  # MongoDB Database
  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password123
      - MONGO_INITDB_DATABASE=lula
    volumes:
      - mongo_data:/data/db
      - ./apps/backend/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - lula-network

  # Admin Web Panel
  admin-web:
    build:
      context: ./apps/admin-web
      dockerfile: Dockerfile
    ports:
      - "3001:5173"
    environment:
      - VITE_BACKEND_URL=http://localhost:3002
    depends_on:
      - backend
    networks:
      - lula-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./tools/docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tools/docker/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - admin-web
    networks:
      - lula-network

volumes:
  mongo_data:

networks:
  lula-network:
    driver: bridge